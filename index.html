                    { name: "蔓越莓汁 (Cranberry)", amount: 60, color: "bg-rose-700", text: "text-rose-300" },
                    { name: "氣泡水 (Soda Water)", amount: 100, color: "bg-cyan-600", text: "text-cyan-300" }
                ],
                flavor: "微微果酸與清脆氣泡相輔相成，柔化威士忌的酒勁與辛香。",
                steps: [
                    "杯中加滿冰塊。",
                    "倒入 40 ml 威士忌與 60 ml 蔓越莓汁。",
                    "沿杯壁注入 100 ml 氣泡水。",
                    "提拉冰塊混勻即可。"
                ]
            },
            {
                id: 18,
                name: "茉莉可樂蘭姆",
                enName: "Jasmine Rum Coke",
                base: "rum",
                tags: ["蘭姆酒", "茉莉花茶", "可樂"],
                icon: "fa-whiskey-glass",
                color: "#a16207",
                ingredients: [
                    { name: "蘭姆酒 (Rum)", amount: 40, color: "bg-amber-600", text: "text-amber-400" },
                    { name: "茉莉花茶 (Jasmine)", amount: 60, color: "bg-teal-700", text: "text-teal-300" },
                    { name: "可樂 (Coke)", amount: 100, color: "bg-stone-800", text: "text-amber-200" }
                ],
                flavor: "可樂甜味中透出清新茉莉花茶香，減低黏膩感，輕盈好喝。",
                steps: [
                    "冰杯後倒入 40 ml 蘭姆酒。",
                    "加入 60 ml 茉莉花茶混勻。",
                    "緩緩補上 100 ml 可樂。",
                    "輕輕攪拌一次。"
                ]
            },
            {
                id: 19,
                name: "綠宴魔爪蔓越莓",
                enName: "Monster Cranberry Punch",
                base: "cointreau",
                tags: ["蘭姆酒", "君度橙酒", "魔爪能量飲", "蔓越莓汁"],
                icon: "fa-wand-magic-sparkles",
                color: "#e11d48",
                ingredients: [
                    { name: "蘭姆酒 (Rum)", amount: 30, color: "bg-amber-600", text: "text-amber-400" },
                    { name: "君度橙酒 (Cointreau)", amount: 20, color: "bg-orange-500", text: "text-orange-300" },
                    { name: "魔爪能量飲 (Monster)", amount: 80, color: "bg-lime-600", text: "text-lime-300" },
                    { name: "蔓越莓汁 (Cranberry)", amount: 70, color: "bg-rose-700", text: "text-rose-300" }
                ],
                flavor: "能量飲料與蔓越莓交織出絢麗寶石色澤，果香濃郁爆汁。",
                steps: [
                    "杯中加滿大冰塊。",
                    "加入蘭姆酒 30 ml 與君度橙酒 20 ml。",
                    "倒入魔爪 80 ml 與蔓越莓汁 70 ml。",
                    "攪拌均勻呈現迷人漸層。"
                ]
            },
            {
                id: 20,
                name: "威士忌君度氣泡特調",
                enName: "Whisky Cointreau Spritz",
                base: "whisky",
                tags: ["威士忌", "君度橙酒", "氣泡水"],
                icon: "fa-glass-water-droplet",
                color: "#ea580c",
                ingredients: [
                    { name: "威士忌 (Whisky)", amount: 30, color: "bg-amber-700", text: "text-amber-400" },
                    { name: "君度橙酒 (Cointreau)", amount: 30, color: "bg-orange-500", text: "text-orange-300" },
                    { name: "氣泡水 (Soda Water)", amount: 140, color: "bg-cyan-600", text: "text-cyan-300" }
                ],
                flavor: "高雅經典風格，橙香完美引出威士忌溫潤麥芽味，氣泡感十足。",
                steps: [
                    "杯中裝滿冰塊。",
                    "倒入 30 ml 威士忌與 30 ml 君度橙酒。",
                    "注入 140 ml 氣泡水。",
                    "輕輕上下拉提冰塊均勻融合。"
                ]
            }
        ];

        let currentCocktailId = 1;
        let currentFilter = 'all';

        // Render Cocktail Buttons
        function renderButtons() {
            const container = document.getElementById('buttons-grid');
            container.innerHTML = '';

            const filtered = cocktails.filter(c => {
                if (currentFilter === 'all') return true;
                if (currentFilter === 'rum') return c.base === 'rum' || c.ingredients.some(i => i.name.includes('蘭姆酒'));
                if (currentFilter === 'whisky') return c.base === 'whisky' || c.ingredients.some(i => i.name.includes('威士忌'));
                if (currentFilter === 'cointreau') return c.base === 'cointreau' || c.ingredients.some(i => i.name.includes('君度'));
                if (currentFilter === 'monster') return c.ingredients.some(i => i.name.includes('魔爪'));
                return true;
            });

            filtered.forEach(cocktail => {
                const isActive = cocktail.id === currentCocktailId;
                const button = document.createElement('button');
                button.className = `w-full text-left p-3.5 rounded-xl transition-all duration-200 border flex items-center justify-between group ${
                    isActive 
                    ? 'active-btn border-amber-400' 
                    : 'glass-card hover:border-slate-500 text-slate-200 hover:bg-slate-800/90'
                }`;
                button.onclick = () => selectCocktail(cocktail.id);

                button.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg flex items-center justify-center ${isActive ? 'bg-white/20 text-white' : 'bg-slate-800 text-amber-400 border border-slate-700'}">
                            <i class="fa-solid ${cocktail.icon} text-sm"></i>
                        </div>
                        <div>
                            <div class="font-bold text-sm leading-snug">${cocktail.id}. ${cocktail.name}</div>
                            <div class="text-[11px] ${isActive ? 'text-amber-100' : 'text-slate-400'}">${cocktail.enName}</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs opacity-50 group-hover:translate-x-1 transition-transform"></i>
                `;
                container.appendChild(button);
            });
        }

        // Filter Cocktails
        function filterCocktails(filter) {
            currentFilter = filter;
            
            // Update filter button styles
            document.querySelectorAll('#filter-container button').forEach(btn => {
                btn.classList.remove('active', 'bg-slate-800', 'text-amber-400', 'border-amber-500/30');
                btn.classList.add('bg-slate-800', 'text-slate-400', 'border-slate-700');
            });

            event.target.classList.add('active', 'text-amber-400', 'border-amber-500/30');
            renderButtons();
        }

        // Select Cocktail and Render Detail
        function selectCocktail(id) {
            currentCocktailId = id;
            renderButtons();
            renderRecipe();
        }

        // Render Recipe Detail Card
        function renderRecipe() {
            const cocktail = cocktails.find(c => c.id === currentCocktailId);
            const container = document.getElementById('recipe-card');

            if (!cocktail) return;

            // Generate Proportion Bars
            const proportionBars = cocktail.ingredients.map(ing => {
                const percentage = (ing.amount / 200) * 100;
                return `
                    <div class="${ing.color} h-full transition-all duration-500" style="width: ${percentage}%" title="${ing.name}: ${ing.amount}ml (${percentage}%)"></div>
                `;
            }).join('');

            // Generate Ingredients List
            const ingredientsList = cocktail.ingredients.map(ing => `
                <div class="flex items-center justify-between p-3 rounded-lg bg-slate-800/60 border border-slate-700/50">
                    <div class="flex items-center gap-2.5">
                        <div class="w-3 h-3 rounded-full ${ing.color}"></div>
                        <span class="text-sm font-medium text-slate-200">${ing.name}</span>
                    </div>
                    <div class="flex items-baseline gap-1">
                        <span class="text-base font-bold ${ing.text}">${ing.amount}</span>
                        <span class="text-xs text-slate-400">ml</span>
                    </div>
                </div>
            `).join('');

            // Generate Steps List
            const stepsList = cocktail.steps.map((step, idx) => `
                <li class="flex items-start gap-3 text-sm text-slate-300">
                    <span class="flex-shrink-0 w-5 h-5 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs flex items-center justify-center font-bold">${idx + 1}</span>
                    <span class="mt-0.5">${step}</span>
                </li>
            `).join('');

            container.innerHTML = `
                <!-- Header -->
                <div class="flex justify-between items-start pb-4 border-b border-slate-700/60">
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-xs px-2.5 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30 font-medium">No. ${cocktail.id}</span>
                            <span class="text-xs px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">總容量 200 ml</span>
                        </div>
                        <h2 class="text-2xl font-bold text-white tracking-wide">${cocktail.name}</h2>
                        <p class="text-xs text-slate-400 mt-0.5">${cocktail.enName}</p>
                    </div>
                    <button onclick="copyRecipe('${cocktail.name}')" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-xs flex items-center gap-1.5 transition-colors">
                        <i class="fa-regular fa-copy"></i>
                        <span>複製配方</span>
                    </button>
                </div>

                <!-- Proportion Bar -->
                <div class="my-5">
                    <div class="flex justify-between text-xs text-slate-400 mb-1.5">
                        <span>容量視覺比例</span>
                        <span class="font-mono text-amber-400">200 ml</span>
                    </div>
                    <div class="w-full h-3 bg-slate-900 rounded-full overflow-hidden flex p-0.5 gap-0.5 border border-slate-700/80">
                        ${proportionBars}
                    </div>
                </div>

                <!-- Flavor Profile -->
                <div class="bg-amber-500/10 border border-amber-500/20 rounded-xl p-3.5 mb-5 flex items-start gap-3">
                    <i class="fa-solid fa-quote-left text-amber-400/60 text-lg mt-0.5"></i>
                    <p class="text-sm text-amber-200/90 leading-relaxed">${cocktail.flavor}</p>
                </div>

                <!-- Ingredients Section -->
                <div class="mb-5">
                    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2.5 flex items-center gap-1.5">
                        <i class="fa-solid fa-flask text-amber-400"></i> 調配比例 (總量 200ml)
                    </h3>
                    <div class="grid grid-cols-1 gap-2">
                        ${ingredientsList}
                    </div>
                </div>

                <!-- Simple Mix Steps -->
                <div>
                    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2.5 flex items-center gap-1.5">
                        <i class="fa-solid fa-glass-water text-amber-400"></i> 調製步驟
                    </h3>
                    <ul class="space-y-2.5 bg-slate-900/40 p-4 rounded-xl border border-slate-800">
                        ${stepsList}
                    </ul>
                </div>
            `;
        }

        // Copy recipe to clipboard
        function copyRecipe(name) {
            const cocktail = cocktails.find(c => c.name === name);
            if (!cocktail) return;

            let text = `【${cocktail.name} (${cocktail.enName})】調酒配方 (容量: 200ml)\n`;
            cocktail.ingredients.forEach(i => {
                text += `• ${i.name}: ${i.amount}ml\n`;
            });
            text += `風味：${cocktail.flavor}`;

            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);

            showToast(`已複製「${cocktail.name}」配方至剪貼簿！`);
        }

        // Notification Toast
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-5 right-5 bg-amber-500 text-slate-950 px-4 py-2.5 rounded-xl font-medium shadow-lg z-50 transition-all duration-300 transform translate-y-2 opacity-0 flex items-center gap-2 text-sm';
            toast.innerHTML = `<i class="fa-solid fa-check-circle"></i> ${message}`;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => document.body.removeChild(toast), 300);
            }, 2500);
        }

        // Initialize App on load
        window.onload = function() {
            renderButtons();
            renderRecipe();
        };
    </script>
</body>
</html>
